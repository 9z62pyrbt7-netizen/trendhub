services:

  db:
    image: postgres:16-alpine
    container_name: trendhub-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trendhub_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U trendhub -d trendhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: trendhub-api
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      pip install --no-cache-dir -q -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: trendhub-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  trendhub_db:
