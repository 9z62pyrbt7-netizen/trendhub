# TrendHub - üretim yerleşimi
#
# Servisler:
#   db       PostgreSQL 16 (veri: trendhub_db volume'u - SİLMEYİN)
#   migrate  Tek seferlik: `alembic upgrade head` (yalnızca ekleme yapan migration'lar)
#   api      FastAPI (yalnızca iç ağda, nginx üzerinden erişilir)
#   worker   Senkronizasyon işleri + zamanlayıcı (SALT OKUNUR pazaryeri erişimi)
#   web      nginx: statik panel + /api proxy (TRENDHUB_HTTP_PORT) ve web mağazası (TRENDCANTANIZ_HTTP_PORT)
#   storefront  Trendçantanız web mağazası (FastAPI + sunucu tarafı HTML; yönetim API'sini içermez)
#
# Healthcheck: api -> /api/health, worker -> `python -m app.cli healthcheck worker`,
# web -> nginx üzerinden /api/health. Durum: `docker compose ps`.
#
# Yükseltmeden önce yedek alın:
#   docker compose exec db pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB" > trendhub-$(date +%F).dump
x-logging: &default-logging
  # Log dosyaları sınırlı: disk dolmasın (servis başına en fazla ~30 MB)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: trendhub-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trendhub_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # migrate / api / worker aynı yerel imajı kullanır (Docker Hub'dan çekilmez).
  migrate:
    logging: *default-logging
    build: ./backend
    image: trendhub-backend
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    logging: *default-logging
    build: ./backend
    image: trendhub-backend
    container_name: trendhub-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'healthy' in urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    logging: *default-logging
    build: ./backend
    image: trendhub-backend
    container_name: trendhub-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "healthcheck", "worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Trendçantanız web mağazası: TrendHub veritabanından katalog/stok okur, web siparişlerini
  # "Trendçantanız Web" satış kanalı olarak yazar. Pazaryeri API'lerine hiçbir istek göndermez.
  storefront:
    logging: *default-logging
    build: ./backend
    image: trendhub-backend
    container_name: trendhub-storefront
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STOREFRONT_IMAGE_CACHE_DIR: /var/cache/trendcantaniz/img
    command: ["uvicorn", "app.storefront.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - storefront_images:/var/cache/trendcantaniz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'healthy' in urllib.request.urlopen('http://127.0.0.1:8000/api/store/health', timeout=3).read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    logging: *default-logging
    image: nginx:1.27-alpine
    container_name: trendhub-web
    restart: unless-stopped
    ports:
      # deploy/deploy.sh 8081 doluysa 8082-8099 arasından boş bir port seçip .env'e yazar
      - "${TRENDHUB_HTTP_PORT:-8081}:80"
      # Trendçantanız web mağazası (önüne TLS sonlandırıcı konur: https://www.trendcantaniz.com → bu port)
      - "${TRENDCANTANIZ_HTTP_PORT:-8090}:8090"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # Klasör olarak bağlanır (tek dosya bağlamak, git dosyayı yenilediğinde eski içeriği
      # göstermeye devam eder). nginx conf.d içinden yalnızca *.conf okur -> web/nginx.conf.
      - ./web:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_started

volumes:
  trendhub_db:
  # Web mağazası ürün görseli önbelleği (WebP); silinirse kendiliğinden yeniden üretilir
  storefront_images:
