{% extends "base.html" %}
{% block content %}
<section class="section account">
  <div class="container container--narrow">
    <div class="page-head"><h1 class="page-title">Yeni şifre</h1></div>
    {% if token %}
    <form class="form account__card" data-api-form="/api/store/account/password/reset" novalidate>
      <input type="hidden" name="token" value="{{ token }}">
      <label class="field"><span>Yeni şifre</span><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"><small class="field-hint">En az 8 karakter; harf ve rakam içermeli.</small></label>
      <p class="form-message form-message--error" data-form-error hidden role="alert"></p>
      <button type="submit" class="btn btn--dark btn--block">Şifremi yenile</button>
    </form>
    {% else %}
    <div class="notice"><p>Bağlantı geçersiz. <a href="/hesap/sifremi-unuttum">Yeni bir bağlantı isteyin</a>.</p></div>
    {% endif %}
  </div>
</section>
{% endblock %}
