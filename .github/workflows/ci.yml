name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app migrations
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check web/assets/app.js
      - name: nginx config syntax
        run: |
          docker run --rm --add-host api:127.0.0.1 -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Test .env (yalnızca CI; gerçek secret içermez)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-db-password/' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://trendhub:ci-db-password@db:5432/trendhub#' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password-123/' .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          sed -i 's/^APP_SECRET=.*/APP_SECRET=ci-app-secret-not-a-real-secret-123/' .env
      - run: docker compose config -q
      - run: docker compose build
      - name: Yığını başlat ve sağlıklı olmasını bekle
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            api=$(docker inspect -f '{{.State.Health.Status}}' trendhub-api 2>/dev/null || echo none)
            worker=$(docker inspect -f '{{.State.Health.Status}}' trendhub-worker 2>/dev/null || echo none)
            web=$(docker inspect -f '{{.State.Health.Status}}' trendhub-web 2>/dev/null || echo none)
            db=$(docker inspect -f '{{.State.Health.Status}}' trendhub-db 2>/dev/null || echo none)
            echo "db=$db api=$api worker=$worker web=$web"
            [ "$db" = healthy ] && [ "$api" = healthy ] && [ "$worker" = healthy ] && [ "$web" = healthy ] && exit 0
            sleep 5
          done
          docker compose ps; exit 1
      - name: Duman testi
        run: ADMIN_USER=admin ADMIN_PASSWORD=ci-admin-password-123 BASE_URL=http://localhost:8081 scripts/smoke_test.sh
      - name: migrate ikinci kez çalıştırılabilir (idempotent)
        run: docker compose run --rm migrate
      - name: api yeniden oluşturulunca nginx yeni IP'yi bulur (502 regresyonu)
        run: |
          docker compose up -d --no-deps --force-recreate api
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health || true)
            echo "nginx->api: $code"; [ "$code" = 200 ] && exit 0; sleep 2
          done
          exit 1
      - name: deploy.sh ile güncelleme (yedek + migrate + nginx reload + sağlık + duman testi)
        run: |
          chmod 600 .env
          TRENDHUB_GIT_PULL=0 TRENDHUB_BUILD=0 ADMIN_USER=admin ADMIN_PASSWORD=ci-admin-password-123 ./deploy/deploy.sh
          ls -l backups/ | grep -q '\.dump' || { echo "yedek dosyası yok"; exit 1; }
      - name: api/worker loglarında log biçimleme hatası yok ve access log yazılıyor
        run: |
          if docker compose logs api worker | grep -E "Logging error|TypeError"; then echo "::error::log hatası"; exit 1; fi
          docker compose logs api | grep -q '"GET /api/health' || { echo "::error::access log yok"; exit 1; }
      - name: Loglar
        if: always()
        run: docker compose logs --no-color | tail -n 300
      - if: always()
        run: docker compose down -v

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env dosyası commit edilmemeli
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env dosyası repoda bulunmamalı"; exit 1
          fi
