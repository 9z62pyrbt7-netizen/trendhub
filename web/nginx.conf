# Giriş denemelerine IP başına sınır (uygulama içi kilitlemeye ek olarak)
limit_req_zone $binary_remote_addr zone=th_login:10m rate=10r/m;

# Önde ayrı bir TLS sonlandırıcı varsa onun bildirdiği şemayı koru; yoksa bağlantının şeması.
# (İstemci "https" yazarsa en fazla kendi çerezi Secure olur; güvenliği zayıflatmaz.)
map $http_x_forwarded_proto $th_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # api container'ı yeniden oluşturulduğunda IP'si değişir. Docker'ın iç DNS'i ile
    # ad her 10 sn'de yeniden çözülür; aksi hâlde nginx eski IP'ye gidip 502 döner.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $th_api http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # nginx yapılandırması statik olarak servis edilmesin
    location = /nginx.conf { return 404; }

    location = /api/auth/login {
        limit_req zone=th_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $th_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $th_forwarded_proto;
    }

    location /api/ {
        proxy_pass $th_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $th_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # location içinde add_header kullanılınca üst seviyedeki başlıklar miras alınmaz;
    # bu yüzden güvenlik başlıkları her konumda tekrar yazılır.
    location /assets/ {
        # Dosya adları sürümlü olmadığı için her istekte ETag ile doğrulanır
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
